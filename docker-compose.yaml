services:
  core:
    build: .
    container_name: openemis-core
    restart: always
    ports:
    - "3000:80"
    depends_on: 
    - db                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 
    environment:
    - DB_HOST=db
    volumes:
      - ./api/.env:/var/www/html/api/.env
      - config:/var/www/html/config
    networks:   
      - openemis-network
  db:
    image: mysql:8.1
    container_name: openemis-db
    restart: always
    entrypoint: sh -c "chmod 644 /etc/my.cnf && exec docker-entrypoint.sh mysqld"
    environment:
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - db:/var/lib/mysql
      - ./docker-config/sql/my.cnf:/etc/my.cnf
    networks:
      - openemis-network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: openemis-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    depends_on:
    - db
    environment:
      - PMA_HOST=db
    networks:
      - openemis-network
volumes:
  db:
  config:
networks:
  openemis-network:
    driver: bridge